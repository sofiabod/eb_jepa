# Push-T dataset config.
# Pre-saved dataset with RGB video observations of a T-shaped pushing task.

# Dataset properties
action_dim: 2
proprio_dim: 4    # with_velocity=True: 2 pos + 2 vel
state_dim: 7
num_channels: 3
img_size: 224

# Trajectory slicing
num_frames: 4     # sample_length for slicing (matches le-wm: history_size=3 + num_preds=1)
frameskip: 5
action_skip: 1
process_actions: concat

# Normalization
normalize_action: true
with_velocity: true

# Train/val split
train_fraction: 0.9

# Dataloader settings
batch_size: 16
num_workers: 4
pin_mem: true

# Transform settings (can be overridden from train configs)
transform:
  random_horizontal_flip: false
  random_resize_aspect_ratio: [1.0, 1.0]
  random_resize_scale: [1.0, 1.0]
  reprob: 0.0
  auto_augment: false
  motion_shift: false
  normalize: [[0.485, 0.456, 0.406], [0.229, 0.224, 0.225]]
  do_255_to_1: false

# Dataset path
data_path: ${EBJEPA_DATA}/pusht_noise
