# RoboCasa dataset config.
# Simulated kitchen manipulation tasks from HDF5 files (human + MimicGen demos).

# Dataset properties
action_dim: 7
proprio_dim: 7
state_dim: 7
num_channels: 3
img_size: 224

# Trajectory slicing
num_frames: 16
frameskip: 1
action_skip: 1

# Normalization
normalize_action: false

# Train/val split
train_fraction: 0.9

# Dataloader settings
batch_size: 16
num_workers: 4
pin_mem: true

# Transform settings (can be overridden from train configs)
transform:
  random_horizontal_flip: false
  random_resize_aspect_ratio: [1.0, 1.0]
  random_resize_scale: [1.0, 1.0]
  reprob: 0.0
  auto_augment: false
  motion_shift: false
  normalize: null
  do_255_to_1: false

# Dataset path
data_path: ${EBJEPA_DATA}/robocasa
