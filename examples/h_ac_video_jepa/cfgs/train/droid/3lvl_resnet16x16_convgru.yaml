slurm:
  gpus: 8
logging:
  log_wandb: true
  wandb_group:
  wandb_sweep:
  log_every: 100
  exp_tag: h-jepa-droid-resnet16x16
  save_every: 5
  tqdm_silent: false
  action_stats_num_batches: 16
meta:
  model_folder:
  load_model: true
  enable_plan_eval: false
  eval_every_itr: -1
  light_eval_freq: 250
  seed: 1
data:
  env_name: droid
  camera_views: ["left_mp4_path", "right_mp4_path"]
  fps: 5
  frameskip: 1
  action_skip: 1
  normalize_action: true
  droid_fraction: 1.0
  train_fraction: 0.9
  seed: 42
  num_frames: 8
  num_frames_val: 8
  process_actions: "concat"
  batch_size: 16
  val_batch_size: 16
  num_workers: 16
  pin_mem: true
  persistent_workers: true
training:
  use_amp: true
  dtype: bfloat16
model:
  compile: true
  dobs: 3
  rollout:
    nsteps: 4
    val_nsteps: 4
  num_levels: 3

  level_1:
    encoder:
      architecture: torchvision
      backbone: resnet18
      truncate_after: layer3
      output_dim: 32
      output_spatial: 16
      pretrained: false
    predictor:
      type: conv_gru
      predictor_dim: 32
      spatial_size: 16
      kernel_size: 3
    regularizer:
      cov_coeff: 8
      std_coeff: 16
      sim_coeff_t: 12
      idm_coeff: 1
      spatial_as_samples: true

  level_2:
    temporal_stride: 2
    encoder:
      architecture: conv
      hidden_dims: [64]
      output_dim: 32
      kernel_size: 3
      stride: 2
    predictor:
      type: conv_gru
      predictor_dim: 32
      spatial_size: 8
      kernel_size: 3
    action_encoder:
      hidden_dims: [64]
      output_dim: 8
      final_ln: true
    regularizer:
      cov_coeff: 4
      std_coeff: 8
      sim_coeff_t: 6
      idm_coeff: 0.5
      spatial_as_samples: true
      action_std_coeff: 4.0
      action_cov_coeff: 2.0

  level_3:
    temporal_stride: 2
    encoder:
      architecture: conv
      hidden_dims: [64]
      output_dim: 32
      kernel_size: 3
      stride: 2
    predictor:
      type: conv_gru
      predictor_dim: 32
      spatial_size: 4
      kernel_size: 3
    action_encoder:
      hidden_dims: [32]
      output_dim: 8
      final_ln: true
    regularizer:
      cov_coeff: 2
      std_coeff: 4
      sim_coeff_t: 3
      idm_coeff: 0.25
      spatial_as_samples: true
      action_std_coeff: 2.0
      action_cov_coeff: 1.0

  level_weights: [1.0, 1.0, 1.0]

optim:
  iterations_per_epoch: 300
  epochs: 100
  lr: 0.0005
  grad_clip: 2.0
  weight_decay: 1.e-5
  lr_scales:
    level_2: 1.0
    level_3: 1.0
probe:
  state_dims: [0, 1]
eval:
  plan_cfg_path: examples/h_ac_video_jepa/cfgs/planning/droid_lvl2_mppi.yaml
  eval_cfg_path: examples/h_ac_video_jepa/cfgs/eval/franka_custom.yaml
  unroll_levels: [1]
visual_decoder:
    enabled: true
    base_channels: 256
    min_channels: 64

sweep:
  # VC regularizer sweep on DROID (resnet18 layer3 → 16×16 spatial, ConvGRU predictor).
  # Sweep L1 loss coefficients (most impactful from two_rooms sweeps)
  # and learning rate. 3 × 3 × 2 × 2 × 3 = 108 runs
  param_grid:
    model.level_1.regularizer.cov_coeff: [4, 8, 16]
    model.level_1.regularizer.std_coeff: [8, 16, 32]
    model.level_1.regularizer.sim_coeff_t: [6, 12]
    optim.lr: [0.0003, 0.0005]
    meta.seed: [1, 1000, 10000]
