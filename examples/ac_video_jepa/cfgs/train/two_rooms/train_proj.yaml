logging:
  log_wandb: true
  wandb_group:
  wandb_sweep:
  log_every: 10
  exp_tag: 26-01-15
  save_every: 1
  tqdm_silent: false
meta:
  model_folder:
  load_model: true
  enable_plan_eval: true
  eval_every_itr: -1
  light_eval_freq: 100
  seed: 1
data:
  env_name: two_rooms
  # Training-specific overrides (base config in eb_jepa/datasets/two_rooms/data_config.yaml)
  batch_size: 384
  num_workers: 16
  pin_mem: true
  persistent_workers: true
training:
  use_amp: true
  dtype: bfloat16
model:
  compile: true
  dobs: 2
  encoder:
    architecture: impala
    stack_sizes: [16, 32, 32]
    output_dim: 512
  rollout:
    nsteps: 8
  regularizer:
    cov_coeff: 8
    std_coeff: 16
    sim_coeff_t: 12
    idm_coeff: 1
    pool_time: true
    spatial_as_samples: false
    use_proj: false
    idm_after_proj: false
    sim_t_after_proj: false
  # Cost module for planning objectives
  cost:
    projector:
      enabled: true
      mlp_spec: "512-256-64"
    loss:
      detach_encoder: true
optim:
  epochs: 12
  lr: 0.001
  grad_clip: 2.0
  weight_decay: 1.e-5
eval:
  plan_cfg_path: examples/ac_video_jepa/cfgs/planning/mppi_proj.yaml
  eval_cfg_path: examples/ac_video_jepa/cfgs/eval/two_rooms.yaml

# --- Parameters used when running with --full-sweep
sweep:
  param_grid:
    model.cost.projector.mlp_spec: ["512-256-64", "512-256-32", "512-256-16", "512-256-8", "512-256-2"]
    model.cost.loss.detach_encoder: [true, false]
    meta.seed: [1, 1000, 10000]
