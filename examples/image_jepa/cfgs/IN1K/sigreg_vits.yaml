# Image SIGReg (BCS) Training Configuration
# Train a self-supervised image representation model on ImageNet1k with ViT-S/16
# Sweep findings: only lmbd=0.01 works; ph512 po256 best; AdamW expected to help
slurm:
  gpus: 8

meta:
  seed: 42
  device: auto

data:
  dataset: imagenet1k
  data_dir: ${EBJEPA_DSETS}/ImageNet
  batch_size: 2048
  num_workers: 16
  num_views: 8
  multi_crop: true
  n_global_views: 2
  global_crop_scale: [0.3, 1.0]
  local_crop_scale: [0.05, 0.3]
  local_crop_size: 98

model:
  type: vit_cls_s
  patch_size: 14
  compile: false # incompatible with certain version of HF transformers

  use_projector: true
  proj_hidden_dim: 1024
  proj_output_dim: 128

loss:
  type: bcs
  lmbd: 0.005

optim:
  type: adamw
  epochs: 300
  lr: 5.0e-4
  weight_decay: 5.0e-2
  warmup_epochs: 5
  warmup_start_lr: 5.0e-7
  min_lr: 5.0e-7

logging:
  log_wandb: true
  wandb_group:
  log_every: 10
  save_every: 25
  tqdm_silent: false

training:
  use_amp: true
  dtype: bfloat16

sweep:
  param_grid:
    model.proj_hidden_dim: [512, 1024]
    model.proj_output_dim: [64, 128]
    loss.lmbd: [0.005, 0.01, 0.02]
    optim.lr: [1.e-4, 5.0e-4, 8.0e-4]
