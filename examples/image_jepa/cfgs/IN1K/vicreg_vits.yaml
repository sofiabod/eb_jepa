# Image JEPA (VICReg) Training Configuration
# Train a self-supervised image representation model on ImageNet1k with ViT-S/16
# Sweep findings: ph4096 po1024 best projector; AdamW >> LARS for ViTs (CIFAR10: +6%)
slurm:
  gpus: 8

meta:
  seed: 42
  device: auto

data:
  dataset: imagenet1k
  data_dir: ${EBJEPA_DSETS}/ImageNet
  batch_size: 2048
  num_workers: 16
  num_views: 8
  multi_crop: true
  n_global_views: 2
  global_crop_scale: [0.3, 1.0]
  local_crop_scale: [0.05, 0.3]
  local_crop_size: 98

model:
  type: vit_cls_s
  patch_size: 14
  compile: false # incompatible with certain version of HF transformers

  use_projector: true
  proj_hidden_dim: 4096
  proj_output_dim: 8192

loss:
  type: vicreg
  std_coeff: 1.0
  cov_coeff: 10

optim:
  type: adamw
  epochs: 100
  lr: 5.0e-4
  weight_decay: 5.0e-2
  warmup_epochs: 10
  warmup_start_lr: 5.0e-7
  min_lr: 5.0e-7

logging:
  log_wandb: true
  wandb_group:
  log_every: 10
  save_every: 50
  tqdm_silent: false

training:
  use_amp: true
  dtype: bfloat16

sweep:
  param_grid:
    model.proj_hidden_dim: [4096, 8192]
    model.proj_output_dim: [8192]
    loss.cov_coeff: [10, 80]
    optim.lr: [1.e-4, 5.0e-4, 8.0e-4]
